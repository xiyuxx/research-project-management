name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s research-project-management/tests -v > tests.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tail -60 tests.log | while IFS= read -r line; do echo "::error::${line}"; done
            tail -120 tests.log
          fi
          exit "$code"
      - name: Initialize and exercise a project
        run: |
          target="$(mktemp -d)"
          python research-project-management/scripts/init_project.py "$target" --name "CI Project"
          python "$target/tools/research.py" group-new --slug ci --title "CI"
          python "$target/tools/research.py" new --group GRP-001 --slug baseline --title "Baseline"
          python "$target/tools/research.py" reindex
          python "$target/tools/research.py" list --json
          python "$target/tools/research.py" idea-new --slug moe-fusion --title "MoE routing"
      - name: Exercise the configuration gate
        run: |
          target="$(mktemp -d)"
          python research-project-management/scripts/init_project.py "$target" --name "Gate"
          python - "$target" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = {"experiment_id": "EXP-0001",
                      "changes": {"optimizer.lr": 0.001}}
          effective = {"experiment_id": "EXP-0001",
                       "config": {"optimizer": {"lr": 1e-3}}}
          (root / "expected.json").write_text(json.dumps(expected))
          (root / "effective.json").write_text(json.dumps(effective))
          effective["config"]["optimizer"]["lr"] = 0.01
          (root / "effective-mismatch.json").write_text(json.dumps(effective))
          PY
          python "$target/tools/run_with_gate.py" \
            --expected "$target/expected.json" \
            --effective "$target/effective.json" \
            --receipt "$target/check.json" \
            -- python -c "print('gate launched')"
          test "$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$target/check.json")" = passed
          set +e
          python "$target/tools/run_with_gate.py" \
            --expected "$target/expected.json" \
            --effective "$target/effective-mismatch.json" \
            --receipt "$target/check-mismatch.json" \
            -- python -c "print('must not run')" > "$target/out.txt"
          code=$?
          set -e
          test "$code" -eq 1
          ! grep -q "must not run" "$target/out.txt"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s research-project-management/tests -v > tests.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tail -60 tests.log | while IFS= read -r line; do echo "::error::${line}"; done
            tail -120 tests.log
          fi
          exit "$code"
      - name: Initialize and exercise a project
        run: |
          target="$(mktemp -d)/proj"
          winpath() { cygpath -w "$1"; }
          python research-project-management/scripts/init_project.py "$(winpath "$target")" --name "CI Windows"
          python "$(winpath "$target/tools/research.py")" group-new --slug ci --title "CI"
          python "$(winpath "$target/tools/research.py")" new --group GRP-001 --slug baseline --title "Baseline"
          python "$(winpath "$target/tools/research.py")" reindex
          python "$(winpath "$target/tools/research.py")" list --json
          python "$(winpath "$target/tools/research.py")" idea-new --slug moe-fusion --title "MoE routing"
          test -f "$target/experiments/.ledger.lock.db"
